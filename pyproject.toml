[project]
name = "hefesto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rocketpy",
    "pyprojroot",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml>=6.0.3",
    "joblib>=1.6.0",
    "openmotor",
    "pytest>=9.1.1",
    "PyQt6",
    "ezdxf",
    "platformdirs",
    "pyqt_distutils",
    "cython",
    "setuptools",
    "scikit-fmm",
    "scikit-image",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "configs*", "centralControle*", "scripts*"]

# openMotor (motorlib/uilib) vem direto do GitHub, fixado num commit, para o
# projeto ser reproduzível em qualquer máquina sem depender de vendor/.
[tool.uv.sources]
openmotor = { git = "https://github.com/reilleya/openMotor.git", rev = "dcc7fd62045d55036451b833f60e16a786f4685d" }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pipreqs>=0.5.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]

